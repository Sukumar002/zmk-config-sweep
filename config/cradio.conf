# Increase wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Enable five-column mouse emulation bindings on both halves and dongle.
CONFIG_ZMK_POINTING=y

# Five Bluetooth host profiles plus split peripheral connections.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
# Disable studio locking
CONFIG_ZMK_STUDIO_LOCKING=n
