# Dongle is the split central and does not scan a local key matrix.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# nice!nano / compatible Pro Micro-form-factor nRF52840 dongle battery support.
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y

# 128x64 SSD1306 display and peripheral battery telemetry.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Preserve the custom pointing behaviors supported by the shared feature base.
CONFIG_ZMK_POINTING=y
