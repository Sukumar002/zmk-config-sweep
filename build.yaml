# Build standalone BLE and dongle-based Sweep firmware.
# The right peripheral firmware is identical in both modes and is built once.
---
include:
  # Standalone BLE: left half is central, right half is peripheral.
  - board: nice_nano//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sweep_left_central

  # Shared by both standalone BLE and dongle modes.
  - board: nice_nano//zmk
    shield: cradio_right
    artifact-name: sweep_right_peripheral

  # Dongle mode: left half is a peripheral; the dongle is central.
  - board: nice_nano//zmk
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: sweep_left_peripheral

  - board: nice_nano//zmk
    shield: cradio_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sweep_central_128x64

  # Alternate dongle OLED resolution test. Same MCU, I2C pins (SDA P0.22 / SCL P0.24), and central role.
  - board: nice_nano//zmk
    shield: cradio_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sweep_central_128x32

  # Dedicated settings-reset firmware for the nice!nano-compatible nRF52840 MCUs used by this build.
  # Flash this only when you intentionally want to clear stored ZMK settings/bonding data.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: sweep_settings_reset
