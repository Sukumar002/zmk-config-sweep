# Build both standalone BLE and dongle-based Sweep firmware.
# The BLE keymap is preserved from the original Sweep configuration.
---
include:
  # Standalone BLE: left half is central, right half is peripheral.
  - board: nice_nano//zmk
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sweep_ble_left_central

  - board: nice_nano//zmk
    shield: cradio_right
    artifact-name: sweep_ble_right_peripheral

  # Dongle mode: both halves are peripherals; the dongle is central.
  - board: nice_nano//zmk
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: sweep_dongle_left_peripheral

  - board: nice_nano//zmk
    shield: cradio_right
    artifact-name: sweep_dongle_right_peripheral

  - board: nice_nano//zmk
    shield: cradio_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sweep_dongle_central_128x64
